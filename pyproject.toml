[project]
name = "hello"
version = "0.1.0"
description = "An example Flask app running in Docker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.1",
  "celery==5.7.0",
  "flask==3.1.3",
  "flask-db==0.4.1",
  "flask-debugtoolbar==0.16.0",
  "flask-secrets==0.1.0",
  "flask-sqlalchemy==3.1.1",
  "flask-static-digest==0.4.1",
  "gunicorn==26.2.0",
  "jinja2==3.1.6",
  "psycopg==3.3.8",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "redis==8.1.0",
  "ruff==0.17.4",
  "setuptools==84.2.1",
  "sqlalchemy==2.1.8",
  "sqlalchemy-utils==0.43.0",
  "werkzeug==3.1.9",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "SIM", "E501"]
